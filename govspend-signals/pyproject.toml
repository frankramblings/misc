[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govspend-signals"
version = "0.1.0"
description = "Signal box for government-spending-driven equity catalysts (SEC EDGAR + extensible feeds)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "fastapi>=0.111",
    "httpx>=0.27",
]
telegram = [
    "httpx>=0.27",
]
dashboard = [
    "rich>=13.0",
]
resolver = [
    "rapidfuzz>=3.0",
]
price = [
    "yfinance>=0.2",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "webauthn>=2.1",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]
full = [
    "httpx>=0.27",
    "rich>=13.0",
    "rapidfuzz>=3.0",
    "yfinance>=0.2",
]

[project.scripts]
govspend = "govspend_signals.cli:main"

[tool.setuptools.packages.find]
include = ["govspend_signals*"]
