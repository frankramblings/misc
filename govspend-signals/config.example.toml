# ────────────────────────────────────────────────────────────────────────────
# NEW INGESTORS
# ────────────────────────────────────────────────────────────────────────────

[ingestors]
# How many days back to look for signals on each ingest run.
lookback_days = 7

[ingestors.usaspending]
enabled = true
# Federal agency abbreviations recognized by USASpending.gov.
agencies = ["HHS", "EPA", "DOE", "DOT", "USACE", "USDA"]
# Only surface awards at or above this threshold (USD).
min_award_amount = 1000000

[ingestors.fedregister]
enabled = true
# Exact agency names as used by the Federal Register API.
agencies = [
    "Centers for Medicare & Medicaid Services",
    "Environmental Protection Agency",
    "Federal Energy Regulatory Commission",
    "Department of Transportation",
    "Health and Human Services Department",
]
# RULE = final rule, PROPOSED_RULE = NPRM, NOTICE = agency notice
document_types = ["RULE", "PROPOSED_RULE", "NOTICE"]

[ingestors.congress]
enabled = true
# Pulls from housestockwatcher.com and senatestockwatcher.com (public).
# No API key required.

[ingestors.sbir]
enabled = true
# SBIR agency abbreviations. Only surfaces awards to these agencies.
agencies = ["DARPA", "ARPA-H", "BARDA", "NIH", "NSF", "DOE", "EPA"]

[ingestors.norway]
enabled = true
# Norges Bank Investment Management files 13F with SEC.
# CIK is resolved automatically; no extra config needed.

[ingestors.catalyst]
enabled = true
# Static catalyst calendar (FOMC, CMS rate notices, earnings blackout).

[ingestors.grants_gov]
enabled = true
# Grants.gov NOFO tracker — Notices of Funding Opportunity.
# Posted 3-12 months before awards: a leading indicator for where money is headed.
# No API key required.
max_results = 200

[ingestors.propublica]
enabled = true
# ProPublica Congress API — bill tracking across healthcare, infrastructure, energy.
# Bills appropriating money are 3-18 month leading indicators for contracts.
# A free API key increases rate limits: https://www.propublica.org/datastore/api/propublica-congress-api
api_key = ""   # override with PROPUBLICA_API_KEY env var

[ingestors.lobbying]
enabled = true
# Senate LDA lobbying disclosure spike detector.
# Companies lobbying heavily on specific bills = they expect those bills to pass.
# Free API: https://lda.senate.gov/api/
# Optional key for higher rate limits.
api_key = ""   # override with LOBBYING_API_KEY env var
min_amount = 50000  # Only surface filings above this quarterly spend threshold

# ────────────────────────────────────────────────────────────────────────────
# ALERT DELIVERY (all disabled by default — configure via env vars or here)
# ────────────────────────────────────────────────────────────────────────────

[notifiers.telegram]
# Set enabled = true and supply TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID env vars.
# Create a bot: https://t.me/BotFather → /newbot
# Get chat_id: send a message to your bot, then call GET /getUpdates
enabled = false
bot_token = ""   # override with TELEGRAM_BOT_TOKEN env var
chat_id = ""     # override with TELEGRAM_CHAT_ID env var

[notifiers.webhook]
# POST JSON payload to any URL on each new signal.
# Set WEBHOOK_URL and optionally WEBHOOK_SECRET (sent as X-Govspend-Secret header).
enabled = false
url = ""
secret = ""

[notifiers.smtp]
# Email delivery. Works with Gmail App Passwords (set password via SMTP_PASSWORD env var).
# Gmail: enable 2FA → Security → App passwords → generate one.
enabled = false
host = "smtp.gmail.com"
port = 587
username = ""         # your Gmail address
# password via SMTP_PASSWORD env var (never put credentials in this file)
to = ""               # destination address
from = ""             # defaults to username if blank
